<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'" />
  <title>ReadNote</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img src="../../assets/icons/icon32.png" alt="ReadNote" class="logo" />
        <div class="brand-text">
          <h1 class="app-title">ReadNote</h1>
          <span class="app-subtitle">Reading &amp; Note Companion</span>
        </div>
      </div>
    </header>

    <main class="popup-main">
      <div class="action-grid">
        <button class="action-btn" id="btn-summary" title="Summarize selection or page">
          <span class="icon-wrap icon-indigo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </span>
          <span class="action-label">Summarize</span>
          <span class="action-hint">Selection or page</span>
        </button>

        <button class="action-btn" id="btn-notes" title="Open my notes">
          <span class="icon-wrap icon-amber" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </span>
          <span class="action-label">Notes</span>
          <span class="action-hint">Write &amp; export</span>
        </button>

        <button class="action-btn" id="btn-read" title="Read selection or page aloud">
          <span class="icon-wrap icon-emerald" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </span>
          <span class="action-label">Read Aloud</span>
          <span class="action-hint">Voice &amp; translate</span>
        </button>

        <button class="action-btn" id="btn-quiz" title="Generate a quiz from this page">
          <span class="icon-wrap icon-violet" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </span>
          <span class="action-label">Quiz Me</span>
          <span class="action-hint">Test recall</span>
        </button>
      </div>
    </main>

    <footer class="popup-footer">
      <button id="btn-open-panel" class="open-panel-btn">
        <span>Open Side Panel</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button id="btn-stop-read" class="stop-btn" title="Stop Reading Aloud">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        <span>Stop</span>
      </button>
      <button id="btn-pause-read" class="stop-btn" title="Pause or resume reading aloud">
        <span>Pause / Resume</span>
      </button>
      <button id="btn-focus-mode" class="stop-btn" title="Toggle distraction-free Focus Mode">
        <span>Focus Mode</span>
      </button>
    </footer>
  </div>

  <script src="popup.ts" type="module"></script>
</body>

</html>
